<!-- Contributor Card START -->
<div class="card">
  <div class="card-header">
    <img src="https://avatars.githubusercontent.com/u/00000000?v=4" alt="Profile Picture" class="card-avatar" />
    <div class="card-info">
      <h3 class="card-name">{name}</h3>
      <p class="card-username">@{github_username}</p>
    </div>
  </div>
  <div class="card-body">
    <p class="card-bio">{bio}</p>
    <ul class="card-links">
      <li><a href="{twitter_url}" target="_blank">Twitter</a></li>
      <li><a href="{github_url}" target="_blank">GitHub</a></li>
      <li><a href="{linkedin_url}" target="_blank">LinkedIn</a></li>
    </ul>
  </div>
</div>
<!-- Contributor Card END -->
